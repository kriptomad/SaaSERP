# Config-as-code do serviço "worker" (BullMQ) no Railway — não tem HTTP, logo sem healthcheck.
# Uso: no serviço worker, Settings > Config-as-code > "Railway Config File" =
#   /deploy/railway/railway.worker.toml
# e defina a variável APP_ROLE=worker (ver deploy/railway/README.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/db/**", "package.json", "package-lock.json"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
