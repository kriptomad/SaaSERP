server {
    # fa-infra-web-dockerfile-no-nonroot-user: 8080 (não-privilegiada) para rodar sob
    # a imagem nginxinc/nginx-unprivileged sem CAP_NET_BIND_SERVICE/root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — todas as rotas do React Router caem em index.html (Capítulo 8).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
