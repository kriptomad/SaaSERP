<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- CORREÇÃO DE AUDITORIA (fa-w5-desktop-csp-overbroad): CSP original liberava
         'unsafe-inline', data:, http:, https: e ws: em default-src — permitia
         praticamente qualquer origem/script inline. Esta janela (launcher/onboarding,
         renderer de apps/desktop/src) nunca faz fetch/XHR/WebSocket direto: toda
         chamada de rede passa pelo processo main via IPC (ver src/screens/*.tsx,
         api.network.pingUrl), e não há nenhum <script> inline em index.html — só o
         módulo externo carregado abaixo. style-src mantém 'unsafe-inline' porque
         Emotion/MUI (CSS-in-JS) injeta <style> em runtime; não há alternativa viável
         sem reescrever todo o design system para nonce/hash. A janela do ERP real
         (apps/web, outro index.html, outro processo de build) não é afetada por esta
         política. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filitech ERP Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
